<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Bypass / Safelink Unshortener</title>
    <!-- Menghubungkan file CSS -->
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <header>
            <h1>⚡ Link Bypass Tool</h1>
            <p>Masukkan link pendek atau safelink untuk melacak tujuan akhirnya.</p>
        </header>

        <div class="card">
            <div class="input-group">
                <label for="targetUrl">Tempel Link di Sini:</label>
                <input type="text" id="targetUrl" placeholder="https://contoh.com/link-pendek...">
            </div>
            
            <button id="bypassBtn" onclick="bypassLink()">
                <span id="btnText">Proses Link</span>
            </button>

            <div id="resultContainer" class="result-box hidden">
                <h3>Hasil Tujuan Akhir:</h3>
                <div class="result-content">
                    <a id="finalLink" href="#" target="_blank">-</a>
                    <button id="copyBtn" onclick="copyResult()">Salin</button>
                </div>
            </div>

            <div id="errorContainer" class="error-box hidden">
                <p id="errorText">-</p>
            </div>
        </div>

        <footer>
            <p>Ditenagai oleh GitHub Pages & Cloudflare Workers</p>
        </footer>
    </div>

    <!-- Script Penghubung ke Cloudflare Worker -->
    <script>
        async function bypassLink() {
            const urlInput = document.getElementById('targetUrl').value.trim();
            const btnText = document.getElementById('btnText');
            const bypassBtn = document.getElementById('bypassBtn');
            const resultContainer = document.getElementById('resultContainer');
            const errorContainer = document.getElementById('errorContainer');
            const finalLink = document.getElementById('finalLink');
            const errorText = document.getElementById('errorText');

            // Validasi input kosong
            if (!urlInput) {
                alert("Mohon masukkan link terlebih dahulu!");
                return;
            }

            // Ubah tombol jadi loading
            bypassBtn.disabled = true;
            btnText.innerText = "Memproses...";
            resultContainer.classList.add('hidden');
            errorContainer.classList.add('hidden');

            // ⚠️ GANTI URL DI BAWAH DENGAN URL CLOUDFLARE WORKER MILIKMU SENDIRI ⚠️
            const workerUrl = "https://gantidengankerjaaslimu.workers.dev/?url=" + encodeURIComponent(urlInput);

            try {
                const response = await fetch(workerUrl);
                const data = await response.json();

                if (data.success) {
                    finalLink.href = data.final_url;
                    finalLink.innerText = data.final_url;
                    resultContainer.classList.remove('hidden');
                } else {
                    errorText.innerText = "Gagal: " + (data.error || "Terjadi kesalahan sistem.");
                    errorContainer.classList.remove('hidden');
                }
            } catch (err) {
                errorText.innerText = "Kesalahan jaringan: Gagal terhubung ke Cloudflare Worker.";
                errorContainer.classList.remove('hidden');
            } finally {
                // Kembalikan tombol ke semula
                bypassBtn.disabled = false;
                btnText.innerText = "Proses Link";
            }
        }

        function copyResult() {
            const finalLinkText = document.getElementById('finalLink').innerText;
            navigator.clipboard.writeText(finalLinkText).then(() => {
                const copyBtn = document.getElementById('copyBtn');
                copyBtn.innerText = "Disalin!";
                setTimeout(() => { copyBtn.innerText = "Salin"; }, 2000);
            });
        }
    </script>
</body>
</html>
