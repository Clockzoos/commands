<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The #1 ad-link bypasser. Paste and unlock.</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="bg-grid"></div>

    <main class="hero-container">
        <div class="content-wrapper">
            
            <h1 class="main-title">The #1 ad-link bypasser.<br>Paste and unlock.</h1>
            <p class="sub-description">
                Linkvertise, LootLabs, Rekonise, shorteners and paste sites. One quick check, then the clean destination.
            </p>

            <div class="input-box-wrapper">
                <div class="input-group">
                    <i class="fa-solid fa-link input-icon"></i>
                    <input type="text" id="targetUrl" placeholder="https://sub2unlock.com/..." autocomplete="off">
                </div>
                <button id="bypassBtn" class="unlock-btn" onclick="bypassLink()">
                    <span id="btnText">Unlock</span>
                    <i class="fa-solid fa-arrow-right" id="btnIcon"></i>
                </button>
            </div>

            <div id="resultContainer" class="result-box hidden">
                <div class="result-header">
                    <i class="fa-solid fa-circle-check"></i> Berhasil Diekstrak:
                </div>
                <div class="result-content">
                    <input type="text" id="finalLinkInput" readonly>
                    <button id="copyBtn" onclick="copyResult()">
                        <i class="fa-solid fa-copy"></i> Salin
                    </button>
                </div>
                <a id="openLink" href="#" target="_blank" class="open-link-btn">
                    Buka Tautan Langsung <i class="fa-solid fa-external-link-alt"></i>
                </a>
            </div>

            <div id="errorContainer" class="error-box hidden">
                <i class="fa-solid fa-triangle-exclamation"></i>
                <span id="errorText">-</span>
            </div>

        </div>
    </main>

    <script>
        async function bypassLink() {
            const urlInput = document.getElementById('targetUrl');
            const url = urlInput.value.trim();
            const btnText = document.getElementById('btnText');
            const btnIcon = document.getElementById('btnIcon');
            const bypassBtn = document.getElementById('bypassBtn');
            const resultContainer = document.getElementById('resultContainer');
            const errorContainer = document.getElementById('errorContainer');
            const finalLinkInput = document.getElementById('finalLinkInput');
            const openLink = document.getElementById('openLink');
            const errorText = document.getElementById('errorText');

            if (!url) {
                urlInput.style.borderColor = "#ef4444";
                setTimeout(() => { urlInput.style.borderColor = ""; }, 500);
                return;
            }

            bypassBtn.disabled = true;
            btnText.innerText = "Unlocking...";
            btnIcon.className = "fa-solid fa-spinner fa-spin";
            resultContainer.classList.add('hidden');
            errorContainer.classList.add('hidden');

            // URL Worker kamu sudah dipasang di sini secara otomatis
            const workerUrl = "https://bypass.ggbloxlord.workers.dev/?url=" + encodeURIComponent(url);

            try {
                const response = await fetch(workerUrl);
                const data = await response.json();

                if (data.success) {
                    finalLinkInput.value = data.final_url;
                    openLink.href = data.final_url;
                    resultContainer.classList.remove('hidden');
                } else {
                    errorText.innerText = data.error || "Gagal memproses tautan.";
                    errorContainer.classList.remove('hidden');
                }
            } catch (err) {
                errorText.innerText = "Gagal terhubung ke server worker.";
                errorContainer.classList.remove('hidden');
            } finally {
                bypassBtn.disabled = false;
                btnText.innerText = "Unlock";
                btnIcon.className = "fa-solid fa-arrow-right";
            }
        }

        function copyResult() {
            const finalLinkInput = document.getElementById('finalLinkInput');
            finalLinkInput.select();
            navigator.clipboard.writeText(finalLinkInput.value).then(() => {
                const copyBtn = document.getElementById('copyBtn');
                copyBtn.innerHTML = `<i class="fa-solid fa-check"></i> Tersalin!`;
                copyBtn.style.background = "#059669";
                setTimeout(() => { 
                    copyBtn.innerHTML = `<i class="fa-solid fa-copy"></i> Salin`; 
                    copyBtn.style.background = "";
                }, 2000);
            });
        }
    </script>
</body>
</html>
